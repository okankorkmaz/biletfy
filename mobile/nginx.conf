server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Flutter Web tek sayfalık uygulama — bilinmeyen yol index.html'e düşer.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Derleme çıktısı içerik adresli; uzun süre önbelleklenebilir.
    location ~* \.(?:js|css|wasm|png|jpg|jpeg|gif|svg|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html ve servis çalışanı önbelleklenmez, yoksa güncelleme gelmez.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store";
    }

    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/wasm;
    gzip_min_length   1024;
}
